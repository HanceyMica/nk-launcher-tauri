[package]
name = "nk-launcher-tauri"
version = "0.1.6"
description = "nk-launcher: a fast Windows launcher"
authors = ["HarveyMica"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.55"
fuzzy-matcher = "0.3"
once_cell = "1.20"
chrono = "0.4"
thiserror = "2"
parking_lot = "0.12"
tauri-plugin-dialog = "2"
